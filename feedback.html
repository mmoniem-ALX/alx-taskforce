<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>How was today? — ALX Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#03134F;--twi:#0452F0;--icy:#C5E5FF;--pale:#EBF6FF;--sun:#EAB308;--jas:#FDE791;--green:#1E9E6A;--grey:#5B6B86;--ink:#20304F;--line:#DCE6F7;--bg:#EEF3FC;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--navy);}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);}
  .top{background:var(--navy);color:#fff;padding:20px 20px 24px;position:relative;overflow:hidden;}
  .top::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(4,82,240,.55),transparent 70%);}
  .brand{font-weight:800;font-size:17px;position:relative;z-index:2;}
  .brand span{color:var(--icy);font-weight:400;}
  .kick{color:var(--icy);font-weight:700;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;margin:16px 0 6px;position:relative;z-index:2;}
  .htitle{font-size:27px;font-weight:800;line-height:1.15;position:relative;z-index:2;}
  .sub{color:#9DB6E8;font-size:13.5px;margin-top:8px;position:relative;z-index:2;}
  .body{padding:20px 18px 130px;}
  .q{background:#fff;border-radius:16px;padding:17px 16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(3,19,79,.06);border:1px solid var(--line);}
  .qn{font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:3px;}
  .qh{font-size:12px;color:var(--grey);margin-bottom:12px;}
  .scale{display:flex;gap:6px;flex-wrap:wrap;}
  .scale.n11 .sb{flex:1 1 calc(9.09% - 6px);}
  .sb{flex:1 1 calc(10% - 6px);min-width:30px;aspect-ratio:1;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;font-size:14px;font-weight:700;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;}
  .sb:active{transform:scale(.94);}
  .sb.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--grey);margin-top:7px;}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;transition:.12s;font-size:14px;font-weight:500;color:var(--ink);}
  .opt:active{transform:scale(.99);}
  .opt .dot{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);transition:.12s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;}
  .opt.on{border-color:var(--navy);background:var(--pale);color:var(--navy);font-weight:700;}
  .opt.on .dot{border-color:var(--twi);background:var(--twi);}
  .yn{display:flex;gap:10px;}
  .yn .b{flex:1;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--navy);cursor:pointer;}
  .yn .b.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  input[type=email],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:14px;color:var(--ink);outline:none;margin-top:10px;background:#fff;}
  input:focus,textarea:focus{border-color:var(--twi);}
  textarea{resize:none;height:84px;}
  .hide{display:none;}
  .foot{position:fixed;bottom:0;left:0;right:0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 66%,rgba(238,243,252,0));}
  .foot .inner{max-width:480px;margin:0 auto;}
  .btn{display:block;width:100%;border:0;border-radius:15px;padding:17px;font-family:inherit;font-size:16.5px;font-weight:700;cursor:pointer;background:var(--sun);color:var(--navy);box-shadow:0 8px 20px rgba(3,19,79,.16);}
  .btn:active{transform:scale(.98);}
  .done{text-align:center;padding:70px 24px;}
  .done .tick{width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .done h2{font-size:24px;font-weight:800;color:var(--navy);margin:0 0 10px;}
  .done p{font-size:15px;color:var(--grey);line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">alx <span>Enterprise</span></div>
    <div class="kick">HR Leaders Roundtable</div>
    <div class="htitle">How was today?</div>
    <div class="sub">Two minutes, and it genuinely shapes the next one.</div>
  </div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
/* Google Form backend — ALX Roundtable — Feedback (single packed "Data" field). */
const BACKEND={ enabled:true,
  formAction:'https://docs.google.com/forms/d/e/1FAIpQLSdfirAA0jyQzRMPSvaqcLunzOrqyJ45filxp34wFlbLURqNMA/formResponse',
  data:'entry.135775264' };

const S={rating:null, nps:null, liked:[], followup:null, email:'', comment:''};
const LIKED=["The roundtable","The six principles","Your AI change-readiness","The Task Force experiential","The networking"];
const $=id=>document.getElementById(id);

function scaleRow(key,from,to,loLab,hiLab){
  let h=`<div class="scale ${to-from+1===11?'n11':''}">`;
  for(let i=from;i<=to;i++) h+=`<button class="sb ${S[key]===i?'on':''}" onclick="pick('${key}',${i})">${i}</button>`;
  h+=`</div><div class="ends"><span>${loLab}</span><span>${hiLab}</span></div>`;
  return h;
}
function render(){
  $('body').innerHTML=`
    <div class="q">
      <div class="qn">Overall, how was today?</div>
      <div class="qh">1 = not for me · 10 = outstanding</div>
      ${scaleRow('rating',1,10,'1','10')}
    </div>
    <div class="q">
      <div class="qn">How likely are you to recommend a session like this to a peer?</div>
      <div class="qh">0 = not at all · 10 = absolutely</div>
      ${scaleRow('nps',0,10,'0','10')}
    </div>
    <div class="q">
      <div class="qn">What did you like most?</div>
      <div class="qh">Pick any that apply.</div>
      ${LIKED.map((o)=>{const on=S.liked.includes(o);return `<div class="opt ${on?'on':''}" onclick="toggleLiked('${o.replace(/'/g,"\\'")}')"><span class="dot">${on?'✓':''}</span>${o}</div>`;}).join('')}
    </div>
    <div class="q">
      <div class="qn">Would you like us to follow up with you?</div>
      <div class="yn">
        <button class="b ${S.followup==='Yes'?'on':''}" onclick="pick('followup','Yes')">Yes</button>
        <button class="b ${S.followup==='No'?'on':''}" onclick="pick('followup','No')">No</button>
      </div>
      <input type="email" class="${S.followup==='Yes'?'':'hide'}" id="email" placeholder="Your email" value="${S.email}" oninput="S.email=this.value" />
    </div>
    <div class="q">
      <div class="qn">Anything else? <span style="color:var(--grey);font-weight:500">(optional)</span></div>
      <textarea id="comment" placeholder="What worked, what you'd change…" oninput="S.comment=this.value">${S.comment}</textarea>
    </div>`;
  $('foot').innerHTML=`<div class="inner"><button class="btn" onclick="submit()">Send feedback</button></div>`;
}
function pick(k,v){ S[k]=v; render(); }
function toggleLiked(o){ const i=S.liked.indexOf(o); if(i>=0)S.liked.splice(i,1); else S.liked.push(o); render(); }
function submit(){
  if(BACKEND.enabled && BACKEND.formAction){
    const parts=[];
    if(S.rating!=null)parts.push('rating='+S.rating);
    if(S.nps!=null)parts.push('nps='+S.nps);
    if(S.liked.length)parts.push('liked='+S.liked.join(' | '));
    if(S.followup)parts.push('followup='+S.followup);
    if(S.email)parts.push('email='+S.email.trim());
    if(S.comment)parts.push('comment='+S.comment.replace(/[\r\n]+/g,' ').trim());
    const fd=new FormData();
    fd.append(BACKEND.data, parts.join(' ; '));
    fetch(BACKEND.formAction,{method:'POST',mode:'no-cors',body:fd}).catch(()=>{});
  }
  document.querySelector('.top').style.display='none';
  $('foot').innerHTML='';
  $('body').innerHTML=`<div class="done"><div class="tick">✓</div><h2>Thank you.</h2><p>Your feedback is in. It genuinely helps us make the next one better.</p></div>`;
}
render();
</script>
</body>
</html>
